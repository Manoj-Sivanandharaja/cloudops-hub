
name: CloudOps Hub CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Test, Validate and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
        run: python -m pytest -v tests/

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary \
            k8s/namespace.yaml k8s/app.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            manoj03092005/cloudops-hub-backend:latest
            manoj03092005/cloudops-hub-backend:${{ github.sha }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            manoj03092005/cloudops-hub-frontend:latest
            manoj03092005/cloudops-hub-frontend:${{ github.sha }}
